<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="50%" stop-color="#0e121d"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1018" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 7,4 0,7" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,1 7,4 0,7" fill="#10b981"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
      .muted { fill: #94a3b8; font-size: 15px; }
      .tiny { fill: #94a3b8; font-size: 12.5px; }
      .section { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .pill-badge { fill: #38bdf8; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .box { rx: 16; stroke-width: 1.3; }
      .accent { stroke: #38bdf8; }
      .violet { stroke: #818cf8; }
      .green { stroke: #10b981; }
      .amber { stroke: #f59e0b; }
      .rose { stroke: #ec4899; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <!-- Top Header -->
  <text x="64" y="62" class="title">StevenOS Public Proof Control Plane</text>
  <text x="64" y="94" class="muted">Turning high-reliability financial engineering, AI agent tooling, and living philosophy into a navigable proof chain.</text>

  <!-- 5 Nodes in Proof Flow -->
  <!-- Node 1: Financial & Core Systems -->
  <g transform="translate(64, 160)">
    <rect width="210" height="150" fill="url(#box-grad)" class="box accent"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="24" y="38" class="section">Financial Rails</text>
    <text x="24" y="68" class="tiny">Payment gateways</text>
    <text x="24" y="88" class="tiny">Currency clearing</text>
    <text x="24" y="108" class="tiny">Zero-defect SLA</text>
    <text x="24" y="132" class="mono" fill="#38bdf8" font-size="11" font-weight="700">CORE INFRA</text>
  </g>

  <!-- Node 2: AI Tools & Repos -->
  <g transform="translate(320, 160)">
    <rect width="210" height="150" fill="url(#box-grad)" class="box violet"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#818cf8"/>
    <text x="24" y="38" class="section">AI Agent OS</text>
    <text x="24" y="68" class="tiny">Agent Scorecard eval</text>
    <text x="24" y="88" class="tiny">Digital Twin engine</text>
    <text x="24" y="108" class="tiny">OpenClaw runtime</text>
    <text x="24" y="132" class="mono" fill="#818cf8" font-size="11" font-weight="700">AUTONOMOUS</text>
  </g>

  <!-- Node 3: Verifiable Proof -->
  <g transform="translate(576, 160)">
    <rect width="210" height="150" fill="url(#box-grad)" class="box green"/>
    <rect x="0" y="0" width="210" height="3" rx="1.5" fill="#10b981"/>
    <text x="24" y="38" class="section">Public Receipts</text>
    <text x="24" y="68" class="tiny">Merged open source PRs</text>
    <text x="24" y="88" class="tiny">Automated coverage</text>
    <text x="24" y="108" class="tiny">Trace logs &amp; artifacts</text>
    <text x="24" y="132" class="mono" fill="#10b981" font-size="11" font-weight="700">EVIDENCE</text>
  </g>

  <!-- Node 4: Knowledge & Narrative -->
  <g transform="translate(832, 160)">
    <rect width="304" height="150" fill="url(#box-grad)" class="box amber"/>
    <rect x="0" y="0" width="304" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="24" y="38" class="section">Living Narrative &amp; Vision</text>
    <text x="24" y="68" class="tiny">stevenchouai.github.io (/now · /future)</text>
    <text x="24" y="88" class="tiny">Disciplined strength fitness &amp; vitality</text>
    <text x="24" y="108" class="tiny">Location autonomy &amp; digital nomad freedom</text>
    <text x="24" y="132" class="mono" fill="#f59e0b" font-size="11" font-weight="700">AUTONOMY &amp; LIFE</text>
  </g>

  <!-- Connectors -->
  <line x1="274" y1="235" x2="312" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="530" y1="235" x2="568" y2="235" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="786" y1="235" x2="824" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(64, 355)">
    <rect width="1072" height="105" rx="16" fill="url(#box-grad)" stroke="#334155" stroke-width="1.2"/>
    <rect x="24" y="24" width="8" height="57" rx="4" fill="#38bdf8"/>
    <text x="48" y="48" class="mono" fill="#38bdf8" font-size="13" font-weight="700">CORE PRINCIPLE</text>
    <text x="48" y="74" fill="#f1f5f9" font-size="16" font-weight="600">&quot;Engineering systems with rigor. Living life with intention.&quot;</text>
    <text x="48" y="96" class="tiny">Points become lines, lines become systems, systems compound into personal and engineering freedom.</text>
  </g>
</svg>
