<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Digital Twin operating loop</title>
  <desc id="desc">A file-first digital twin loop: retrieve context, route capability, execute work, write back assets, learn durable rules.</desc>
  <defs>
    <linearGradient id="dtl-bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="50%" stop-color="#12151E"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="dtl-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#DFC088" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#dtl-bg)"/>
  <rect width="1200" height="760" rx="36" fill="url(#dtl-glow)"/>
  <rect x="44" y="44" width="1112" height="672" rx="22" stroke="#F4F1EA" stroke-opacity="0.08" stroke-width="1.5"/>

  <text x="600" y="96" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="14" letter-spacing="0.22em">AUTONOMOUS OPERATING LOOP</text>
  <text x="600" y="136" text-anchor="middle" fill="#F4F1EA" font-family="Georgia, New York, serif" font-size="34">Retrieve → Route → Execute → Write Back → Learn</text>

  <ellipse cx="600" cy="420" rx="370" ry="190" stroke="#DFC088" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Center Hub -->
  <g transform="translate(460, 344)">
    <rect width="280" height="152" rx="24" fill="#151924" stroke="#DFC088" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="140" y="54" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.2em">CORE ENGINE</text>
    <text x="140" y="92" text-anchor="middle" fill="#F4F1EA" font-family="Georgia, New York, serif" font-size="28">Digital Twin</text>
    <text x="140" y="122" text-anchor="middle" fill="#F4F1EA" fill-opacity="0.55" font-family="Inter, -apple-system, sans-serif" font-size="14">File-First Operating Layer</text>
  </g>

  <!-- 5 Orbital Stations -->
  <g transform="translate(96, 358)">
    <rect width="208" height="104" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.35"/>
    <text x="104" y="42" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">01 · RETRIEVE</text>
    <text x="104" y="72" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600">Wiki &amp; Prior Proofs</text>
  </g>

  <g transform="translate(260, 180)">
    <rect width="208" height="104" rx="18" fill="#161A26" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="104" y="42" text-anchor="middle" fill="#93C5FD" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">02 · ROUTE</text>
    <text x="104" y="72" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600">Select Skill &amp; Tool</text>
  </g>

  <g transform="translate(732, 180)">
    <rect width="208" height="104" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.35"/>
    <text x="104" y="42" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">03 · EXECUTE</text>
    <text x="104" y="72" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600">Code · Audit · Ship</text>
  </g>

  <g transform="translate(896, 358)">
    <rect width="208" height="104" rx="18" fill="#161A26" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="104" y="42" text-anchor="middle" fill="#34D399" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">04 · WRITE BACK</text>
    <text x="104" y="72" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600">Durable Artifacts</text>
  </g>

  <g transform="translate(496, 562)">
    <rect width="208" height="104" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.45"/>
    <text x="104" y="42" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">05 · COMPOUND</text>
    <text x="104" y="72" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600">Extract New Rules</text>
  </g>
</svg>
