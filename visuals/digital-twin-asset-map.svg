<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Digital Twin asset map</title>
  <desc id="desc">A map showing raw notes, wiki, capabilities, published site, and learning notes connected around the digital twin.</desc>
  <defs>
    <linearGradient id="dta-bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="50%" stop-color="#12151E"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <radialGradient id="dta-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#DFC088" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#dta-bg)"/>
  <rect width="1200" height="760" rx="36" fill="url(#dta-glow)"/>
  <rect x="44" y="44" width="1112" height="672" rx="22" stroke="#F4F1EA" stroke-opacity="0.08" stroke-width="1.5"/>

  <text x="600" y="96" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="14" letter-spacing="0.22em">COMPOUNDING TOPOLOGY</text>
  <text x="600" y="136" text-anchor="middle" fill="#F4F1EA" font-family="Georgia, New York, serif" font-size="34">Durable Assets Over Ephemeral Chats</text>

  <!-- Connecting Lines -->
  <line x1="340" y1="260" x2="470" y2="360" stroke="#DFC088" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="860" y1="260" x2="730" y2="360" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="340" y1="540" x2="470" y2="440" stroke="#34D399" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="860" y1="540" x2="730" y2="440" stroke="#DFC088" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="600" y1="480" x2="600" y2="575" stroke="#DFC088" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Central Node -->
  <g transform="translate(460, 320)">
    <rect width="280" height="160" rx="24" fill="#151924" stroke="#DFC088" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="140" cy="56" r="18" fill="#DFC088" fill-opacity="0.2" stroke="#DFC088" stroke-width="1.5"/>
    <circle cx="140" cy="56" r="6" fill="#DFC088"/>
    <text x="140" y="106" text-anchor="middle" fill="#F4F1EA" font-family="Georgia, New York, serif" font-size="28">Digital Twin</text>
    <text x="140" y="134" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">MEMORY &amp; ROUTER</text>
  </g>

  <!-- 4 Corner Nodes + Bottom Node -->
  <g transform="translate(110, 196)">
    <rect width="230" height="112" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.32"/>
    <text x="115" y="46" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">INPUT LAYER</text>
    <text x="115" y="78" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600">Raw Notes &amp; Logs</text>
  </g>

  <g transform="translate(860, 196)">
    <rect width="230" height="112" rx="18" fill="#161A26" stroke="#93C5FD" stroke-opacity="0.32"/>
    <text x="115" y="46" text-anchor="middle" fill="#93C5FD" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">INDEX LAYER</text>
    <text x="115" y="78" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600">Obsidian Wiki</text>
  </g>

  <g transform="translate(110, 480)">
    <rect width="230" height="112" rx="18" fill="#161A26" stroke="#34D399" stroke-opacity="0.32"/>
    <text x="115" y="46" text-anchor="middle" fill="#34D399" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">PUBLIC SURFACE</text>
    <text x="115" y="78" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600">Site &amp; Proof Chain</text>
  </g>

  <g transform="translate(860, 480)">
    <rect width="230" height="112" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.32"/>
    <text x="115" y="46" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">EXECUTION</text>
    <text x="115" y="78" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600">Reusable Skills</text>
  </g>

  <g transform="translate(440, 575)">
    <rect width="320" height="92" rx="18" fill="#161A26" stroke="#DFC088" stroke-opacity="0.45"/>
    <text x="160" y="38" text-anchor="middle" fill="#DFC088" font-family="SF Mono, Menlo, monospace" font-size="12" letter-spacing="0.16em">FEEDBACK LOOP</text>
    <text x="160" y="68" text-anchor="middle" fill="#F4F1EA" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="600">Compounding Heuristics</text>
  </g>
</svg>
